[project]
name = "ai-learning"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.19.0",
    "openai>=3.3.1",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["llm.py"]
