[project]
name = "ai-learning"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.19.0",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.3.7",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "openai>=3.3.1",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["llm.py", "llm_raw.py"]
